<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shiva Temple{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container nav">
        <a class="logo" href="/">Shiva Temple</a>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/services">Services</a>
            <a href="/events">Events</a>
            <a href="/gallery">Gallery</a>
            <a href="/contact">Contact</a>
            <a class="pill" href="/donate">Donate</a>
        </nav>
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="site-footer">
    <div class="container">
        <p>© {{ now|default(2024) }} Shiva Temple. All rights reserved.</p>
        <div class="footer-links">
            <a href="/contact">Contact</a>
            <a href="/donate">Support</a>
        </div>
    </div>
</footer>
</body>
</html>
